<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>08 · 浮层（新建 / 采用项目 sheet）— HTML 轨</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/components.css">
<style>
/* 仅本页样式（底衬 = 项目 Tab 压暗 + sheet） */
.h-row{display:flex;align-items:flex-end;justify-content:space-between;margin:46px 16px 0}
.h-row h1{font-size:30px;font-weight:800;color:var(--ink-title)}
.h-ic{display:flex;gap:14px;padding-bottom:8px}
.h-ic svg{width:22px;height:22px;stroke:var(--ink-1);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.search{margin:8px 16px 0;height:38px;border-radius:12px;background:var(--fill-search);display:flex;
        align-items:center;gap:8px;padding:0 12px;font-size:15px;color:var(--ink-2)}
.gcard{margin:14px 16px 0;height:230px;background:var(--bg-elevated);border:1px solid var(--sep);border-radius:16px}
.dim{top:170px}
.segc{display:flex;border-radius:10px;background:var(--bg-elevated2);padding:3px;margin-top:12px}
.segc span{flex:1;text-align:center;padding:5px 0;font-size:13px;border-radius:8px;color:var(--ink-2)}
.segc .on{background:var(--bg-elevated3);color:var(--ink-1);font-weight:600}
.klabel{font-size:12px;color:var(--ink-2);margin:14px 0 6px}
.kfield{height:38px;border-radius:10px;background:var(--bg-elevated2);
        border:1px solid color-mix(in srgb,var(--c-primary) 60%,transparent);
        display:flex;align-items:center;padding:0 14px;font-size:14px;color:var(--ink-1)}
.kfield .caret{width:1.5px;height:16px;background:var(--c-primary);margin-left:2px}
.kfield.plain{border-color:var(--sep);color:var(--ink-2)}
.kbtns{display:flex;justify-content:space-between;margin-top:16px}
.kbtns .c{width:120px;height:34px;border-radius:17px;border:1px solid var(--sep-strong);
          display:flex;align-items:center;justify-content:center;font-size:13.5px;color:var(--ink-1);cursor:pointer}
.kbtns .p{font-size:13.5px;font-weight:600;color:var(--c-primary);display:flex;align-items:center;cursor:pointer}
</style>
<script src="assets/theme.js"></script>
</head>
<body>

<div class="stage">
  <div class="island"></div>
  <div class="status"><span>9:41</span><span class="sb-r"><svg width="16" height="10" viewBox="0 0 16 10"><rect x="0" y="6" width="3" height="4" rx="0.5" fill="currentColor"/><rect x="4.5" y="4" width="3" height="6" rx="0.5" fill="currentColor"/><rect x="9" y="2" width="3" height="8" rx="0.5" fill="currentColor"/><rect x="13.5" width="2.5" height="10" rx="0.5" fill="currentColor" opacity="0.4"/></svg><svg width="22" height="11" viewBox="0 0 22 11"><path d="M2,4 A10,9 0 0 1 20,4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5,7 A7,6.5 0 0 1 17,7" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="11" cy="9.5" r="1.4" fill="currentColor"/></svg><svg width="24" height="11" viewBox="0 0 24 11"><rect x="0.5" y="0.5" width="20" height="10" rx="3" fill="none" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="14" height="7" rx="1.5" fill="currentColor"/><rect x="21.5" y="3.5" width="2" height="4" rx="1" fill="currentColor" opacity="0.4"/></svg></span></div>

  <!-- 底衬：项目 Tab（压暗） -->
  <div>
    <div class="h-row">
      <h1>项目</h1>
      <div class="h-ic">
        <svg viewBox="-10 -10 20 20" data-symbol="plus"><path d="M0,-6.5 V6.5 M-6.5,0 H6.5"/></svg>
        <svg viewBox="-10 -10 20 20" data-symbol="gearshape"><circle r="5.6"/><circle r="2.2"/><path d="M0,-5.6 v-2.8 M0,5.6 v2.8 M-5.6,0 h-2.8 M5.6,0 h2.8 M-4,-4 l-2,-2 M4,4 l2,2 M-4,4 l-2,2 M4,-4 l2,-2"/></svg>
      </div>
    </div>
    <div class="search">搜索项目与会话</div>
    <div class="gcard"></div>
  </div>
  <div class="dim" style="top:170px"></div>

  <!-- 半屏 sheet：添加项目 -->
  <div class="sheet" style="padding-bottom:16px" data-symbol="sheet">
    <div class="grab"></div>
    <div class="shd"><h2>添加项目</h2></div>

    <div class="segc">
      <span class="on">新建目录</span><span>采用已有目录</span>
    </div>

    <div class="klabel">名称</div>
    <div class="kfield">agents-website<span class="caret"></span></div>

    <div class="klabel">路径</div>
    <div class="kfield plain">~/srv/agents-website</div>

    <div class="kbtns">
      <span class="c">取消</span>
      <span class="p">创建并进入 ›</span>
    </div>
  </div>

  <div class="tabbar" style="position:absolute;left:0;right:0;bottom:0;margin-top:0;z-index:11">
    <span class="tb on"><svg viewBox="-10 -10 20 20" data-symbol="folder"><path d="M-10,-4.5 a2.5,2.5 0 0 1 2.5,-2.5 h4.1 l2.3,2.7 h8.6 a2.5,2.5 0 0 1 2.5,2.5 v7 a2.5,2.5 0 0 1 -2.5,2.5 h-15 a2.5,2.5 0 0 1 -2.5,-2.5 z"/></svg><span class="lb">项目</span></span>
    <span class="tb"><svg viewBox="-10 -10 20 20" data-symbol="terminal"><rect x="-10" y="-8" width="20" height="16" rx="3.5"/><path d="M-5.5,-2.5 l3,3 l-3,3"/><path d="M0.5,3.5 h5"/></svg><span class="lb">工作台</span></span>
    <span class="tb"><svg viewBox="-10 -10 20 20" data-symbol="doc.text"><path d="M-7,-10 h7 l6.5,6.5 v11.5 a2,2 0 0 1 -2,2 h-11.5 a2,2 0 0 1 -2,-2 v-16 a2,2 0 0 1 2,-2 z"/><path d="M0,-10 v6.5 h6.5"/></svg><span class="lb">文件</span></span>
    <span class="tb"><svg viewBox="-10 -10 20 20" data-symbol="square.grid.2x2"><rect x="-10" y="-10" width="8.4" height="8.4" rx="2.2"/><rect x="1.6" y="-10" width="8.4" height="8.4" rx="2.2"/><rect x="-10" y="1.6" width="8.4" height="8.4" rx="2.2"/><rect x="1.6" y="1.6" width="8.4" height="8.4" rx="2.2"/></svg><span class="lb">插件</span></span>
  </div>
  <div class="home" style="z-index:12"></div>

  <!-- 编号 pin（相对 stage）：① 入口 ② 二选一 ③ 行内校验 ④ 创建并进入 -->
  <span class="pin" style="left:340px;top:70px;z-index:20">1</span>
  <span class="pin" style="left:330px;top:364px;z-index:20">2</span>
  <span class="pin" style="left:350px;top:432px;z-index:20">3</span>
  <span class="pin" style="left:310px;top:648px;z-index:20">4</span>
</div>

<div class="panel">
  <h4>编号说明（与图内 pin 一一对应）</h4>
  <ol>
    <li><b>①</b>入口：项目 Tab ＋ / 空态主按钮 / 桌面 Sidebar 分组头 ＋</li>
    <li><b>②</b>新建 = 建目录并纳管；采用 = 扫描已有目录（列出候选，勾选纳管）</li>
    <li><b>③</b>重名/路径非法 = 行内提示，不弹窗</li>
    <li><b>④</b>创建成功 → push 进入该项目工作台（空态引导建第一个会话）；桌面同表单为 Sheet 居中</li>
  </ol>
</div>

</body></html>
