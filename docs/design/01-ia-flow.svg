<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="880" viewBox="0 0 1300 880"
     font-family="-apple-system,'SF Pro Text','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="mB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0A84FF"/></marker>
    <marker id="mG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#30D158"/></marker>
    <marker id="mO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#FF9F0A"/></marker>
    <marker id="mP" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#BF5AF2"/></marker>
    <g id="ic-folder" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-10,-4.5 a2.5,2.5 0 0 1 2.5,-2.5 h4.1 l2.3,2.7 h8.6 a2.5,2.5 0 0 1 2.5,2.5 v7 a2.5,2.5 0 0 1 -2.5,2.5 h-15 a2.5,2.5 0 0 1 -2.5,-2.5 z"/></g>
    <g id="ic-term" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="-10" y="-8" width="20" height="16" rx="3.5"/><path d="M-5.5,-2.5 l3,3 l-3,3"/><path d="M0.5,3.5 h5"/></g>
    <g id="ic-doc" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-7,-10 h7 l6.5,6.5 v11.5 a2,2 0 0 1 -2,2 h-11.5 a2,2 0 0 1 -2,-2 v-16 a2,2 0 0 1 2,-2 z"/><path d="M0,-10 v6.5 h6.5"/><path d="M-3.5,2 h7"/><path d="M-3.5,5.5 h7"/></g>
    <g id="ic-grid" fill="none" stroke-width="1.7" stroke-linejoin="round"><rect x="-10" y="-10" width="8.4" height="8.4" rx="2.2"/><rect x="1.6" y="-10" width="8.4" height="8.4" rx="2.2"/><rect x="-10" y="1.6" width="8.4" height="8.4" rx="2.2"/><rect x="1.6" y="1.6" width="8.4" height="8.4" rx="2.2"/></g>
    <g id="ic-gear" fill="none" stroke-width="1.7" stroke-linecap="round"><circle r="5.6"/><circle r="2.2"/><path d="M0,-5.6 v-2.8 M0,5.6 v2.8 M-5.6,0 h-2.8 M5.6,0 h2.8 M-4,-4 l-2,-2 M4,4 l2,2 M-4,4 l-2,2 M4,-4 l2,-2"/></g>
    <g id="ic-lock" fill="none" stroke-width="1.7" stroke-linecap="round"><rect x="-7.5" y="-2" width="15" height="11" rx="3.5"/><path d="M-4,-2 v-3.2 a4,4 0 0 1 8,0 V-2"/></g>
    <g id="ic-info" fill="none" stroke-width="1.7" stroke-linecap="round"><circle r="9"/><path d="M0,-3.2 V4"/><circle cx="0" cy="-6.3" r="1.2" fill="#98989F" stroke="none"/></g>
    <g id="ic-plus" fill="none" stroke-width="1.9" stroke-linecap="round"><path d="M0,-6.5 V6.5 M-6.5,0 H6.5"/></g>
    <g id="ic-msg" fill="none" stroke-width="1.7" stroke-linejoin="round"><rect x="-9" y="-8" width="18" height="13" rx="4"/><path d="M-3,5 L-3,9.5 L1.5,5"/></g>
    <g id="ic-pin" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0,8 C0,8 -5.5,1.5 -5.5,-2.5 a5.5,5.5 0 1 1 11,0 C5.5,1.5 0,8 0,8 z"/><circle cx="0" cy="-2.5" r="1.8"/></g>
  </defs>

  <rect width="1300" height="880" fill="#F5F5F7"/>
  <text x="650" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#3A3A3C">agents-remote · 信息架构总图 —— 3 层 + 临时面板（三端同构）</text>

  <!-- 层标签 -->
  <text x="30" y="108" font-size="12" font-weight="700" fill="#8E8E93">L0</text>
  <text x="30" y="215" font-size="12" font-weight="700" fill="#8E8E93">L1</text>
  <text x="30" y="438" font-size="12" font-weight="700" fill="#8E8E93">L2</text>
  <text x="30" y="596" font-size="12" font-weight="700" fill="#8E8E93">L3</text>
  <text x="30" y="726" font-size="12" font-weight="700" fill="#8E8E93">浮层</text>

  <!-- L0 登录 -->
  <rect x="316" y="72" width="260" height="66" rx="14" fill="#1C1C1E" stroke="#3A3A3C"/>
    <!-- SF Symbols: lock -->
  <use href="#ic-lock" transform="translate(346,105)" stroke="#30D158"/>
  <text x="370" y="100" font-size="15" font-weight="700" fill="#FFFFFF">登录 · 单密码</text>
  <text x="370" y="120" font-size="11" fill="#98989F">token 免登 · PWA · 离线横幅</text>
  <line x1="446" y1="140" x2="446" y2="164" stroke="#30D158" stroke-width="2.5" marker-end="url(#mG)"/>
  <text x="460" y="158" font-size="11" fill="#28A745">默认进入上次项目（工作台）</text>

  <!-- L1 四 Tab + 设置 -->
  <rect x="60" y="170" width="210" height="84" rx="14" fill="#1C1C1E" stroke="#3A3A3C"/>
    <!-- SF Symbols: folder -->
  <use href="#ic-folder" transform="translate(94,200)" stroke="#0A84FF"/>
  <text x="118" y="206" font-size="15" font-weight="700" fill="#FFFFFF">① 项目</text>
  <text x="80" y="234" font-size="11" fill="#98989F">列表 · 置顶/活动 · ⚙设置</text>

  <rect x="340" y="170" width="210" height="84" rx="14" fill="#1C1C1E" stroke="#3A3A3C"/>
    <!-- SF Symbols: terminal -->
  <use href="#ic-term" transform="translate(374,200)" stroke="#0A84FF"/>
  <text x="398" y="206" font-size="15" font-weight="700" fill="#FFFFFF">② 工作台</text>
  <text x="360" y="234" font-size="11" fill="#98989F">上次项目 · 实例 + 工具</text>

  <rect x="620" y="170" width="210" height="84" rx="14" fill="#1C1C1E" stroke="#3A3A3C"/>
    <!-- SF Symbols: doc.text -->
  <use href="#ic-doc" transform="translate(654,200)" stroke="#0A84FF"/>
  <text x="678" y="206" font-size="15" font-weight="700" fill="#FFFFFF">③ 文件</text>
  <text x="640" y="234" font-size="11" fill="#98989F">全局文件 · 只读 · 同一组件</text>

  <rect x="900" y="170" width="210" height="84" rx="14" fill="#1C1C1E" stroke="#3A3A3C"/>
    <!-- SF Symbols: square.grid.2x2 -->
  <use href="#ic-grid" transform="translate(934,200)" stroke="#0A84FF"/>
  <text x="958" y="206" font-size="15" font-weight="700" fill="#FFFFFF">④ 插件</text>
  <text x="920" y="234" font-size="11" fill="#98989F">技能 · MCP · 作用域切换</text>

  <rect x="1150" y="170" width="90" height="84" rx="14" fill="#1C1C1E" stroke="#3A3A3C"/>
    <!-- SF Symbols: gearshape -->
  <use href="#ic-gear" transform="translate(1195,200)" stroke="#F2F2F7"/>
  <text x="1195" y="232" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">设置</text>

  <!-- 置顶直达（紫） -->
  <path d="M165,168 L165,148 L445,148 L445,166" fill="none" stroke="#BF5AF2" stroke-width="2.5" marker-end="url(#mP)"/>
  <text x="255" y="163" text-anchor="middle" font-size="11" font-weight="600" fill="#8E4FD1">置顶会话 · 跨项目直达</text>

  <!-- L1 → L2 push / 直达 -->
  <line x1="165" y1="256" x2="165" y2="356" stroke="#0A84FF" stroke-width="2.5" marker-end="url(#mB)"/>
  <text x="172" y="300" font-size="11" font-weight="600" fill="#0A84FF">点项目 → push</text>
  <line x1="445" y1="256" x2="445" y2="356" stroke="#8E8E93" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="452" y="300" font-size="11" fill="#6D6D72">同一目的地 · Tab 直达上次项目</text>
  <rect x="1150" y="262" width="90" height="22" rx="11" fill="#EAF3FF"/>
  <text x="1195" y="277" text-anchor="middle" font-size="11" font-weight="600" fill="#0A84FF">push 进入</text>
  <text x="1195" y="300" text-anchor="middle" font-size="10.5" fill="#6D6D72">项目页 ⚙ / Sidebar 底部</text>

  <!-- L2 工作台 -->
  <rect x="60" y="360" width="1180" height="150" rx="14" fill="#1C1C1E" stroke="#3A3A3C"/>
  <text x="84" y="390" font-size="14" font-weight="700" fill="#FFFFFF">L2 · 项目工作台 —— push 进入；内部切换不加深度、输出流永不销毁</text>
  <!-- 实例 pills -->
  <rect x="84" y="408" width="136" height="30" rx="15" fill="#0A84FF" fill-opacity="0.18" stroke="#0A84FF" stroke-opacity="0.55"/>
  <circle cx="102" cy="423" r="3.5" fill="#30D158"/>
  <text x="112" y="427" font-size="12" font-weight="600" fill="#F2F2F7">claude·auth</text>
  <rect x="232" y="408" width="124" height="30" rx="15" fill="#2C2C2E" stroke="#3A3A3C"/>
  <circle cx="250" cy="423" r="3.5" fill="none" stroke="#98989F" stroke-width="1.4"/>
  <text x="260" y="427" font-size="12" fill="#98989F">codex·api</text>
  <rect x="368" y="408" width="96" height="30" rx="15" fill="#2C2C2E" stroke="#3A3A3C"/>
  <text x="384" y="427" font-size="11.5" font-family="'SF Mono',Consolas,monospace" fill="#98989F">&gt;_ term·1</text>
  <rect x="476" y="408" width="86" height="30" rx="15" fill="#2C2C2E" stroke="#3A3A3C"/>
    <!-- SF Symbols: message -->
  <use href="#ic-msg" transform="translate(494,423) scale(0.62)" stroke="#98989F"/>
  <text x="506" y="427" font-size="12" fill="#98989F">pi·chat</text>
  <rect x="574" y="408" width="112" height="30" rx="15" fill="none" stroke="#FF9F0A" stroke-opacity="0.7" stroke-dasharray="5 4"/>
    <!-- SF Symbols: plus -->
  <use href="#ic-plus" transform="translate(594,423) scale(0.7)" stroke="#FF9F0A"/>
  <text x="608" y="427" font-size="12" fill="#FF9F0A">新建实例</text>
  <text x="980" y="428" font-size="11" fill="#6D6D72">切换 = 横滑 / 点 pill · 不 push</text>
  <!-- 工具 chips（x 中心与下方箭头车道对齐：349 / 551 / 753） -->
  <rect x="303" y="452" width="92" height="30" rx="9" fill="#2C2C2E" stroke="#3A3A3C"/>
    <!-- SF Symbols: folder -->
  <use href="#ic-folder" transform="translate(321,467) scale(0.72)" stroke="#F2F2F7"/>
  <text x="334" y="471" font-size="12.5" font-weight="600" fill="#F2F2F7">文件</text>
  <rect x="511" y="452" width="80" height="30" rx="9" fill="#2C2C2E" stroke="#3A3A3C"/>
  <text x="527" y="471" font-size="12.5" font-weight="600" fill="#F2F2F7">Git</text>
  <rect x="713" y="452" width="80" height="30" rx="9" fill="#2C2C2E" stroke="#3A3A3C"/>
  <text x="729" y="471" font-size="12.5" font-weight="600" fill="#F2F2F7">Wiki</text>
  <line x1="815" y1="452" x2="815" y2="482" stroke="#3A3A3C"/>
  <text x="835" y="465" font-size="11" fill="#6D6D72">低频进 ⋯ 菜单：</text>
  <text x="835" y="482" font-size="11" fill="#6D6D72">ℹ · 分屏 · 置顶 · 关闭</text>
  <text x="84" y="500" font-size="11.5" fill="#6F6F76">常驻 4 组：实例 + 文件 + Git + Wiki（铁律 6）· 技能/MCP 管理在 L1 插件 · 移动端聚焦单实例，桌面可分屏</text>

  <!-- L2 → L3 -->
  <line x1="349" y1="512" x2="349" y2="556" stroke="#0A84FF" stroke-width="2.5" marker-end="url(#mB)"/>
  <text x="357" y="540" font-size="11" font-weight="600" fill="#0A84FF">push</text>
  <line x1="551" y1="512" x2="551" y2="556" stroke="#0A84FF" stroke-width="2.5" marker-end="url(#mB)"/>
  <text x="559" y="540" font-size="11" font-weight="600" fill="#0A84FF">push</text>

  <!-- L3 -->
  <rect x="262" y="560" width="174" height="66" rx="14" fill="#1C1C1E" stroke="#3A3A3C"/>
    <!-- SF Symbols: doc.text -->
  <use href="#ic-doc" transform="translate(288,584) scale(0.8)" stroke="#98989F"/>
  <text x="304" y="589" font-size="13" font-weight="700" fill="#FFFFFF">文件预览</text>
  <text x="280" y="611" font-size="10.5" fill="#98989F">文本 / 图片 · 顶部返回</text>

  <rect x="464" y="560" width="174" height="66" rx="14" fill="#1C1C1E" stroke="#3A3A3C"/>
  <text x="482" y="589" font-size="13" font-weight="700" fill="#FFFFFF">单文件 diff</text>
  <text x="482" y="611" font-size="10.5" font-family="'SF Mono',Consolas,monospace" fill="#98989F">unified · 顶部返回</text>

  <rect x="666" y="560" width="174" height="66" rx="14" fill="#F5F5F7" stroke="#8E8E93" stroke-dasharray="5 4"/>
  <text x="684" y="589" font-size="12.5" font-weight="700" fill="#6D6D72">技能 / MCP → L1 插件</text>
  <text x="684" y="611" font-size="10.5" fill="#8E8E93">作用域：全局 ⇄ 本项目</text>

  <!-- L2 → 浮层（穿过 L3 空档车道 147 / 955 / 1157） -->
  <line x1="147" y1="512" x2="147" y2="686" stroke="#FF9F0A" stroke-width="2.5" marker-end="url(#mO)"/>
  <text x="155" y="600" font-size="11" font-weight="600" fill="#E08600">sheet</text>
  <line x1="955" y1="512" x2="955" y2="686" stroke="#FF9F0A" stroke-width="2.5" marker-end="url(#mO)"/>
  <text x="963" y="600" font-size="11" font-weight="600" fill="#E08600">sheet / popover</text>
  <line x1="1157" y1="512" x2="1157" y2="686" stroke="#FF9F0A" stroke-width="2.5" marker-end="url(#mO)"/>
  <text x="1165" y="600" font-size="11" font-weight="600" fill="#E08600">sheet</text>

  <!-- 浮层 -->
  <rect x="60" y="690" width="174" height="66" rx="14" fill="#1C1C1E" stroke="#FF9F0A" stroke-dasharray="5 4"/>
  <text x="78" y="719" font-size="13" font-weight="700" fill="#FFFFFF">权限审批托盘</text>
  <text x="78" y="741" font-size="10.5" fill="#98989F">聚合 · 逐条/批量 · 跳转</text>

  <rect x="868" y="690" width="174" height="66" rx="14" fill="#1C1C1E" stroke="#FF9F0A" stroke-dasharray="5 4"/>
    <!-- SF Symbols: info.circle -->
  <use href="#ic-info" transform="translate(890,714) scale(0.66)" stroke="#98989F"/>
  <text x="904" y="719" font-size="13" font-weight="700" fill="#FFFFFF">实例信息 ℹ</text>
  <text x="886" y="741" font-size="10.5" fill="#98989F">模型 / 状态 / 自动重试</text>

  <rect x="1070" y="690" width="174" height="66" rx="14" fill="#1C1C1E" stroke="#FF9F0A" stroke-dasharray="5 4"/>
    <!-- SF Symbols: plus -->
  <use href="#ic-plus" transform="translate(1092,714) scale(0.7)" stroke="#98989F"/>
  <text x="1106" y="719" font-size="13" font-weight="700" fill="#FFFFFF">新建实例</text>
  <text x="1088" y="741" font-size="10.5" fill="#98989F">Agent / Terminal / Chat</text>

  <!-- 图例 -->
  <line x1="60" y1="800" x2="96" y2="800" stroke="#0A84FF" stroke-width="2.5" marker-end="url(#mB)"/>
  <text x="104" y="804" font-size="11.5" fill="#3A3A3C">push（层级前进，可返回）</text>
  <line x1="300" y1="800" x2="336" y2="800" stroke="#30D158" stroke-width="2.5" marker-end="url(#mG)"/>
  <text x="344" y="804" font-size="11.5" fill="#3A3A3C">cover（全屏门）</text>
  <line x1="490" y1="800" x2="526" y2="800" stroke="#FF9F0A" stroke-width="2.5" marker-end="url(#mO)"/>
  <text x="534" y="804" font-size="11.5" fill="#3A3A3C">sheet / popover（底下运行状态永不销毁）</text>
  <line x1="820" y1="800" x2="856" y2="800" stroke="#BF5AF2" stroke-width="2.5" marker-end="url(#mP)"/>
  <text x="864" y="804" font-size="11.5" fill="#3A3A3C">跨项目直达（深度不变）</text>
  <text x="60" y="838" font-size="11.5" fill="#6D6D72">三端容器映射：iPhone Tab Bar ↔ iPad/Mac Sidebar · sheet ↔ popover/Inspector · L3 push ↔ Inspector / 新窗口 · 同名同图标，只换容器</text>
  <text x="60" y="862" font-size="11.5" fill="#6D6D72">深度封顶 3 层（铁律 1）· 文件/Git 永远只读，Agent/Terminal 才是运行态（绿色 live 点）· Wiki 为人/Agent 共用知识库 · Pages 不做</text>
</svg>
