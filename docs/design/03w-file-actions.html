<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>03w · 工具（文件操作菜单）— HTML 轨</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/components.css">
<style>
/* 仅本页样式 */
.nav h1{flex:1;text-align:center;display:flex;align-items:center;justify-content:center;gap:4px}
.ticon.hl{background:var(--bg-elevated3);border-radius:6px;padding:4px}
.ticon.hl svg{stroke:var(--ink-1)}
.crumb{flex:none;display:flex;align-items:center;height:30px;padding:0 12px;border-radius:15px;
      background:var(--bg-elevated);border:1px solid var(--sep);font-size:11.5px;white-space:nowrap;overflow:hidden;
      font-family:ui-monospace,'SF Mono',Consolas,monospace;color:var(--ink-2)}
.frow{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:13.5px}
.frow + .frow{border-top:1px solid var(--sep-row)}
.frow .p{font-family:ui-monospace,'SF Mono',Consolas,monospace;color:var(--ink-1);flex:1}
.badge{width:18px;height:15px;border-radius:3px;display:flex;align-items:center;justify-content:center;
       font-size:9.5px;font-weight:600;flex:none;font-family:ui-monospace,Consolas,monospace}
.badge.M{background:var(--tint-orange);color:var(--c-warning-text)}
.frow.sel{background:var(--tint-blue);border:1px solid color-mix(in srgb,var(--c-primary) 60%,transparent);
          border-radius:10px;margin:0 -10px;padding:9px 10px}
.frow.sel + .frow{border-top:none}
.dim{top:190px}
.ctx{position:absolute;left:14px;top:266px;width:372px;background:var(--menu);
     border:1px solid var(--sep-strong);border-radius:10px;z-index:12;
     box-shadow:0 6px 20px color-mix(in srgb,#000 22%,transparent)}
.ctx .row{display:flex;align-items:center;gap:12px;height:45px;padding:0 18px;font-size:14px;color:var(--ink-1)}
.ctx .row.red{color:var(--c-danger);font-weight:600}
.ring{position:absolute;border:1.8px dashed var(--c-success);border-radius:50%;pointer-events:none;z-index:15}
</style>
<script src="assets/theme.js"></script>
</head>
<body>

<div class="stage">
  <div class="island"></div>
  <div class="status"><span>9:41</span><span class="sb-r"><svg width="16" height="10" viewBox="0 0 16 10"><rect x="0" y="6" width="3" height="4" rx="0.5" fill="currentColor"/><rect x="4.5" y="4" width="3" height="6" rx="0.5" fill="currentColor"/><rect x="9" y="2" width="3" height="8" rx="0.5" fill="currentColor"/><rect x="13.5" width="2.5" height="10" rx="0.5" fill="currentColor" opacity="0.4"/></svg><svg width="22" height="11" viewBox="0 0 22 11"><path d="M2,4 A10,9 0 0 1 20,4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5,7 A7,6.5 0 0 1 17,7" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="11" cy="9.5" r="1.4" fill="currentColor"/></svg><svg width="24" height="11" viewBox="0 0 24 11"><rect x="0.5" y="0.5" width="20" height="10" rx="3" fill="none" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="14" height="7" rx="1.5" fill="currentColor"/><rect x="21.5" y="3.5" width="2" height="4" rx="1" fill="currentColor" opacity="0.4"/></svg></span></div>

  <div class="page">
    <div class="nav">
      <span class="back">项目</span>
      <h1>agents-web <span class="sw"></span></h1>
      <span class="ic" data-symbol="info.circle"><svg viewBox="-10 -10 20 20"><circle r="9"/><path d="M0,-3.2 V4"/><circle cx="0" cy="-6.3" r="1.2" fill="var(--c-primary)" stroke="none"/></svg></span>
      <span class="ic" data-symbol="ellipsis"><svg viewBox="-10 -10 20 20"><circle cx="-6" r="1.7" fill="currentColor" stroke="none"/><circle r="1.7" fill="currentColor" stroke="none"/><circle cx="6" r="1.7" fill="currentColor" stroke="none"/></svg></span>
    </div>

    <div class="row2">
      <div class="pills">
        <span class="crumb">agents-web / src / <b style="color:var(--ink-1)">auth</b></span>
      </div>
      <span class="plus" data-symbol="plus"></span>
      <span class="sep"></span>
      <span class="ticon hl" data-symbol="folder"><svg viewBox="-10 -10 20 20"><path d="M-10,-4.5 a2.5,2.5 0 0 1 2.5,-2.5 h4.1 l2.3,2.7 h8.6 a2.5,2.5 0 0 1 2.5,2.5 v7 a2.5,2.5 0 0 1 -2.5,2.5 h-15 a2.5,2.5 0 0 1 -2.5,-2.5 z"/></svg></span>
      <span class="ticon" data-symbol="arrow.triangle.branch"><svg viewBox="-10 -10 20 20"><circle cx="-6" cy="-6" r="2.6"/><circle cx="-6" cy="6" r="2.6"/><circle cx="6" cy="-6" r="2.6"/><path d="M-6,-3.4 V3.4"/><path d="M6,-3.4 V0 a3.5,3.5 0 0 1 -3.5,3.5 H-3.4"/></svg></span>
      <span class="ticon" data-symbol="book"><svg viewBox="-10 -10 20 20"><path d="M0,-6.5 C-2.4,-8.3 -5.8,-8.8 -9,-7.8 V6.2 C-5.8,5.2 -2.4,5.7 0,7.5 C2.4,5.7 5.8,5.2 9,6.2 V-7.8 C5.8,-8.8 2.4,-8.3 0,-6.5 Z"/><path d="M0,-6.5 V7.5"/></svg></span>
    </div>

    <div class="stream" style="flex:0 auto;padding-top:6px">
      <div class="frow"><span style="font-size:11px;color:var(--ink-3)">▸</span><span class="p" style="font-family:inherit;font-size:14px">hooks</span></div>
      <div class="frow"><span class="p">session.ts</span><span class="badge M">M</span></div>
      <div class="frow sel"><span class="p" style="font-weight:600">passkey.ts</span><span class="badge M">M</span></div>
    </div>
    <div class="dim"></div>

    <!-- 上下文菜单（长按 passkey.ts 行） -->
    <div class="ctx" data-symbol="context-menu">
      <div class="row">打开预览</div>
      <div class="row">重命名</div>
      <div class="row">移动到…</div>
      <div class="row red">删除…</div>
    </div>

    <div class="tabbar" style="position:relative;z-index:11">
      <span class="tb"><svg viewBox="-10 -10 20 20" data-symbol="folder"><path d="M-10,-4.5 a2.5,2.5 0 0 1 2.5,-2.5 h4.1 l2.3,2.7 h8.6 a2.5,2.5 0 0 1 2.5,2.5 v7 a2.5,2.5 0 0 1 -2.5,2.5 h-15 a2.5,2.5 0 0 1 -2.5,-2.5 z"/></svg><span class="lb">项目</span></span>
      <span class="tb on"><svg viewBox="-10 -10 20 20" data-symbol="terminal"><rect x="-10" y="-8" width="20" height="16" rx="3.5"/><path d="M-5.5,-2.5 l3,3 l-3,3"/><path d="M0.5,3.5 h5"/></svg><span class="lb">工作台</span></span>
      <span class="tb"><svg viewBox="-10 -10 20 20" data-symbol="doc.text"><path d="M-7,-10 h7 l6.5,6.5 v11.5 a2,2 0 0 1 -2,2 h-11.5 a2,2 0 0 1 -2,-2 v-16 a2,2 0 0 1 2,-2 z"/><path d="M0,-10 v6.5 h6.5"/></svg><span class="lb">文件</span></span>
      <span class="tb"><svg viewBox="-10 -10 20 20" data-symbol="square.grid.2x2"><rect x="-10" y="-10" width="8.4" height="8.4" rx="2.2"/><rect x="1.6" y="-10" width="8.4" height="8.4" rx="2.2"/><rect x="-10" y="1.6" width="8.4" height="8.4" rx="2.2"/><rect x="1.6" y="1.6" width="8.4" height="8.4" rx="2.2"/></svg><span class="lb">插件</span></span>
    </div>
    <div class="home"></div>

    <!-- 高亮圈：移动到…（相对 stage） -->
    <span class="ring" style="left:56px;top:357px;width:44px;height:44px"></span>

    <!-- 编号 pin：① 选中行 ② 打开预览 ③ 重命名/移动 ④ 删除确认 -->
    <span class="pin" style="left:300px;top:236px">1</span>
    <span class="pin" style="left:200px;top:360px">2</span>
    <span class="pin" style="left:200px;top:383px">3</span>
    <span class="pin" style="left:200px;top:428px">4</span>
  </div>
</div>

<div class="panel">
  <h4>编号说明（与图内 pin 一一对应）</h4>
  <ol>
    <li><b>①</b>长按文件行 → 菜单（桌面右键同款）；文件夹行菜单含「新建到此」</li>
    <li><b>②</b>打开预览 = 03q；重命名 / 移动 = 结构操作，即时生效并同步 Git 工作区状态</li>
    <li><b>③</b>移动到… 支持跨目录；路径由面包屑语境给出</li>
    <li><b>④</b>删除需确认（有未提交改动时额外警示）；内容编辑仍交给 Agent</li>
  </ol>
</div>

</body></html>
