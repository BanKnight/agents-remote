name: docker-image

# CI 打镜像（部署形态批）：push v* tag 触发（外加手动 dispatch），产物推 GHCR。
# 拉取：docker pull ghcr.io/banknight/agents-remote:<tag|latest>
# action 按 commit SHA 钉死（主版本 tag 可移动是供应链面）；升级显式换 SHA，
# dependabot 可自动维护。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/banknight/agents-remote
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # latest 仅随 v* tag 发布——手动 dispatch 从分支触发时不漂移 latest。
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          # 单架构 amd64：多架构（arm64）需 QEMU 交叉构建，bun/claude-code 原生二进制
          # 会成倍拉长构建时间；有 ARM 用户群后再开 matrix。
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
